---
extends: default

ignore: |
  .cache/
  .venv/
  inventories/production/hosts.yml
  inventories/production/group_vars/hoddmimir_hosts/vault.yml
  inventories/lab/hosts.yml
  inventories/lab/group_vars/hoddmimir_hosts/vault.yml

rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  empty-lines:
    max-end: 1
  line-length:
    max: 160
  octal-values:
    forbid-explicit-octal: true
    forbid-implicit-octal: true
  truthy:
    allowed-values:
      - "true"
      - "false"
