---
- name: Run deployment preflight gates
  ansible.builtin.import_tasks: preflight.yml

- name: Install host HTTPS packages
  ansible.builtin.package:
    name: "{{ hoddmimir_https_packages }}"
    state: present

- name: Create dedicated ACME runtime group
  ansible.builtin.group:
    name: "{{ hoddmimir_acme_group }}"
    system: true
    state: present

- name: Create dedicated nologin ACME runtime user
  ansible.builtin.user:
    name: "{{ hoddmimir_acme_user }}"
    group: "{{ hoddmimir_acme_group }}"
    home: "{{ hoddmimir_acme_home }}"
    create_home: false
    shell: /sbin/nologin
    system: true
    state: present

- name: Create private ACME state directory
  ansible.builtin.file:
    path: "{{ hoddmimir_acme_home }}"
    state: directory
    owner: "{{ hoddmimir_acme_user }}"
    group: "{{ hoddmimir_acme_group }}"
    mode: "0700"

- name: Create root-managed ACME secret directory
  ansible.builtin.file:
    path: "{{ hoddmimir_acme_secret_directory }}"
    state: directory
    owner: root
    group: "{{ hoddmimir_acme_group }}"
    mode: "0750"

- name: Install root-managed Hetzner DNS API token file
  ansible.builtin.copy:
    content: "{{ hoddmimir_hetzner_dns_api_token }}\n"
    dest: "{{ hoddmimir_hetzner_dns_api_token_file }}"
    owner: root
    group: "{{ hoddmimir_acme_group }}"
    mode: "0440"
  diff: false
  no_log: true

- name: Create private Caddy candidate directory
  ansible.builtin.file:
    path: "{{ hoddmimir_caddy_candidate_directory }}"
    state: directory
    owner: root
    group: "{{ hoddmimir_caddy_group }}"
    mode: "0750"

- name: Render separate Caddy configuration candidate
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ hoddmimir_caddy_candidate_file }}"
    owner: root
    group: "{{ hoddmimir_caddy_group }}"
    mode: "0640"

- name: Install recoverable HTTPS transaction executor
  ansible.builtin.copy:
    src: https_transaction.py
    dest: "{{ hoddmimir_https_transaction_executable }}"
    owner: root
    group: root
    mode: "0555"

- name: Install daily certificate renewal command
  ansible.builtin.template:
    src: hoddmimir-certificate-renew.sh.j2
    dest: "{{ hoddmimir_certificate_renewal_executable }}"
    owner: root
    group: root
    mode: "0550"

- name: Enable the Caddy OpenRC service without starting it
  ansible.builtin.service:
    name: "{{ hoddmimir_caddy_service }}"
    enabled: true

- name: Enable and start the Alpine periodic scheduler
  ansible.builtin.service:
    name: crond
    enabled: true
    state: started

- name: Create Hoddmímir installation directory
  ansible.builtin.file:
    path: "{{ hoddmimir_install_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Stage and apply isolated deployment transaction
  block:
    - name: Create unique deployment staging directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ hoddmimir_install_directory }}"
        prefix: "{{ hoddmimir_staging_prefix }}"
      register: hoddmimir_deployment_staging
      changed_when: false

    - name: Enforce private staging directory permissions
      ansible.builtin.file:
        path: "{{ hoddmimir_deployment_staging.path }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      changed_when: false

    - name: Create private staging secrets directory
      ansible.builtin.file:
        path: "{{ hoddmimir_deployment_staging.path }}/secrets"
        state: directory
        owner: root
        group: root
        mode: "0700"
      changed_when: false

    - name: Stage transactional deployment executor
      ansible.builtin.copy:
        src: deploy_transaction.py
        dest: "{{ hoddmimir_deployment_staging.path }}/deploy_transaction.py"
        owner: root
        group: root
        mode: "0555"
      changed_when: false

    - name: Stage Docker secret files
      ansible.builtin.copy:
        content: "{{ item.value }}\n"
        dest: "{{ hoddmimir_deployment_staging.path }}/secrets/{{ item.name }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { name: app_secret, value: "{{ hoddmimir_app_secret }}" }
        - { name: mariadb_root_password, value: "{{ hoddmimir_mariadb_root_password }}" }
        - { name: mariadb_migration_password, value: "{{ hoddmimir_mariadb_migration_password }}" }
        - { name: mariadb_web_password, value: "{{ hoddmimir_mariadb_web_password }}" }
        - { name: mariadb_collector_password, value: "{{ hoddmimir_mariadb_collector_password }}" }
        - { name: mariadb_backup_worker_password, value: "{{ hoddmimir_mariadb_backup_worker_password }}" }
        - { name: matrix_webhook_url, value: "{{ hoddmimir_matrix_webhook_url }}" }
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
      diff: false
      no_log: true

    - name: Stage canonical encryption keyring
      ansible.builtin.template:
        src: encryption-keyring.json.j2
        dest: "{{ hoddmimir_deployment_staging.path }}/secrets/encryption_key"
        owner: root
        group: root
        mode: "0600"
      changed_when: false
      diff: false
      no_log: true

    - name: Stage MariaDB initialization script
      ansible.builtin.template:
        src: 10-create-app-users.sh.j2
        dest: "{{ hoddmimir_deployment_staging.path }}/10-create-app-users.sh"
        owner: root
        group: root
        mode: "0555"
      changed_when: false

    - name: Stage runtime environment
      ansible.builtin.template:
        src: runtime.env.j2
        dest: "{{ hoddmimir_deployment_staging.path }}/runtime.env"
        owner: root
        group: root
        mode: "0640"
      changed_when: false

    - name: Stage production Compose model
      ansible.builtin.template:
        src: compose.yaml.j2
        dest: "{{ hoddmimir_deployment_staging.path }}/compose.yaml"
        owner: root
        group: root
        mode: "0640"
      changed_when: false

    - name: Stage production migration Compose model
      ansible.builtin.template:
        src: compose.migration.yaml.j2
        dest: "{{ hoddmimir_deployment_staging.path }}/compose.migration.yaml"
        owner: root
        group: root
        mode: "0640"
      changed_when: false

    - name: Execute deployment transaction
      ansible.builtin.command:
        argv: >-
          {{
            [
              hoddmimir_python_executable,
              hoddmimir_deployment_staging.path ~ '/deploy_transaction.py',
              '--docker-executable=' ~ hoddmimir_docker_executable,
              '--staging-directory=' ~ hoddmimir_deployment_staging.path,
              '--current-compose-file=' ~ hoddmimir_compose_file,
              '--current-migration-compose-file=' ~ hoddmimir_migration_compose_file,
              '--current-environment-file=' ~ hoddmimir_environment_file,
              '--current-mariadb-init-script=' ~ hoddmimir_mariadb_init_script,
              '--current-secrets-directory=' ~ hoddmimir_secrets_directory,
              '--health-url=' ~ hoddmimir_healthcheck_url,
              '--wait-timeout=' ~ (hoddmimir_compose_wait_timeout_seconds | string),
              '--migration-service=' ~ hoddmimir_migration_service,
              '--database-service=' ~ hoddmimir_database_service,
              '--database-bootstrap-script=' ~ hoddmimir_database_bootstrap_script,
              '--encryption-keyring-revision=' ~ (hoddmimir_encryption_keyring['revision'] | string),
              '--transaction-lock-file=' ~ hoddmimir_transaction_lock_file,
            ]
            + (
              hoddmimir_expected_services
              | map('regex_replace', '^(.*)$', '--expected-service=\1')
              | list
            )
          }}
      register: hoddmimir_transaction
      changed_when: (hoddmimir_transaction.stdout | from_json).changed | bool

  always:
    - name: Remove only this deployment staging directory
      ansible.builtin.file:
        path: "{{ hoddmimir_deployment_staging.path }}"
        state: absent
      changed_when: false
      when:
        - hoddmimir_deployment_staging is defined
        - hoddmimir_deployment_staging.path is defined

- name: Issue or renew the public certificate and activate host Caddy
  ansible.builtin.command:
    argv:
      - "{{ hoddmimir_python_executable }}"
      - "{{ hoddmimir_https_transaction_executable }}"
      - "--domain={{ hoddmimir_public_domain }}"
      - "--email={{ hoddmimir_acme_email }}"
      - "--health-url={{ hoddmimir_https_healthcheck_url }}"
      - "--token-file={{ hoddmimir_hetzner_dns_api_token_file }}"
      - "--candidate-caddyfile={{ hoddmimir_caddy_candidate_file }}"
      - "--caddyfile={{ hoddmimir_caddyfile }}"
      - "--certificate-file={{ hoddmimir_certificate_file }}"
      - "--certificate-key-file={{ hoddmimir_certificate_key_file }}"
      - "--lego-state-directory={{ hoddmimir_lego_state_directory }}"
      - "--renew-before-days={{ hoddmimir_acme_renew_before_days }}"
      - "--acme-user={{ hoddmimir_acme_user }}"
      - "--acme-group={{ hoddmimir_acme_group }}"
      - "--caddy-group={{ hoddmimir_caddy_group }}"
      - "--caddy-executable={{ hoddmimir_caddy_executable }}"
      - "--lego-executable={{ hoddmimir_lego_executable }}"
      - "--openssl-executable={{ hoddmimir_openssl_executable }}"
      - "--rc-service-executable={{ hoddmimir_rc_service_executable }}"
      - "--caddy-service={{ hoddmimir_caddy_service }}"
      - "--lock-file={{ hoddmimir_https_transaction_lock_file }}"
  register: hoddmimir_https_transaction
  changed_when: (hoddmimir_https_transaction.stdout | from_json).changed | bool
