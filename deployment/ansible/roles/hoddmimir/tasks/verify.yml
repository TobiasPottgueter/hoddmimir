---
- name: Read running Compose services
  ansible.builtin.command:
    argv:
      - "{{ hoddmimir_docker_executable }}"
      - compose
      - --file
      - "{{ hoddmimir_compose_file }}"
      - ps
      - --services
      - --filter
      - status=running
  register: hoddmimir_running_services
  changed_when: false

- name: Require exactly four running services
  ansible.builtin.assert:
    that:
      - hoddmimir_running_services.stdout_lines | sort == hoddmimir_expected_services | sort
    fail_msg: The expected data-worker, backup-worker, webapp, and mariadb services are not all running.

- name: Check web API health
  ansible.builtin.uri:
    url: "{{ hoddmimir_healthcheck_url }}"
    method: GET
    status_code: 200
    return_content: false

- name: Read the published WebApp binding
  ansible.builtin.command:
    argv:
      - "{{ hoddmimir_docker_executable }}"
      - compose
      - --file
      - "{{ hoddmimir_compose_file }}"
      - port
      - webapp
      - "8080"
  register: hoddmimir_webapp_binding
  changed_when: false

- name: Require the WebApp port to remain loopback-only
  ansible.builtin.assert:
    that:
      - hoddmimir_webapp_binding.stdout_lines == ['127.0.0.1:' ~ (hoddmimir_web_port | string)]
    fail_msg: The WebApp container port is not bound exclusively to the host loopback address.

- name: Inspect HTTPS secret and certificate files
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - { path: "{{ hoddmimir_hetzner_dns_api_token_file }}", mode: "0440", owner: root, group: "{{ hoddmimir_acme_group }}" }
    - { path: "{{ hoddmimir_caddy_candidate_file }}", mode: "0640", owner: root, group: "{{ hoddmimir_caddy_group }}" }
    - { path: "{{ hoddmimir_caddyfile }}", mode: "0640", owner: root, group: "{{ hoddmimir_caddy_group }}" }
    - { path: "{{ hoddmimir_certificate_file }}", mode: "0644", owner: root, group: "{{ hoddmimir_caddy_group }}" }
    - { path: "{{ hoddmimir_certificate_key_file }}", mode: "0640", owner: root, group: "{{ hoddmimir_caddy_group }}" }
  loop_control:
    label: "{{ item.path }}"
  register: hoddmimir_https_files
  no_log: true

- name: Require exact HTTPS file ownership and permissions
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.mode == item.item.mode
      - item.stat.pw_name == item.item.owner
      - item.stat.gr_name == item.item.group
    fail_msg: An HTTPS secret, certificate, key, or candidate file has unsafe ownership or permissions.
  loop: "{{ hoddmimir_https_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  no_log: true

- name: Inspect private ACME state directory
  ansible.builtin.stat:
    path: "{{ hoddmimir_lego_state_directory }}"
    follow: false
  register: hoddmimir_acme_state

- name: Require private dedicated ACME state
  ansible.builtin.assert:
    that:
      - hoddmimir_acme_state.stat.exists
      - hoddmimir_acme_state.stat.isdir
      - not hoddmimir_acme_state.stat.islnk
      - hoddmimir_acme_state.stat.mode == '0700'
      - hoddmimir_acme_state.stat.pw_name == hoddmimir_acme_user
      - hoddmimir_acme_state.stat.gr_name == hoddmimir_acme_group
    fail_msg: The lego account and certificate state is not private to the dedicated ACME identity.

- name: Read Caddy runtime groups
  ansible.builtin.command:
    argv:
      - id
      - -Gn
      - caddy
  register: hoddmimir_caddy_groups
  changed_when: false

- name: Require Caddy to be isolated from ACME token and state
  ansible.builtin.assert:
    that:
      - hoddmimir_acme_group not in hoddmimir_caddy_groups.stdout.split()
    fail_msg: Caddy must not belong to the group that can read the ACME token and state.

- name: Validate active Caddy configuration
  ansible.builtin.command:
    argv:
      - "{{ hoddmimir_caddy_executable }}"
      - validate
      - --config
      - "{{ hoddmimir_caddyfile }}"
      - --adapter
      - caddyfile
  changed_when: false

- name: Require Caddy to be running through OpenRC
  ansible.builtin.command:
    argv:
      - "{{ hoddmimir_rc_service_executable }}"
      - "{{ hoddmimir_caddy_service }}"
      - status
  changed_when: false

- name: Require Alpine periodic certificate renewal to be running
  ansible.builtin.command:
    argv:
      - "{{ hoddmimir_rc_service_executable }}"
      - crond
      - status
  changed_when: false

- name: Read the exact Caddy process ID
  ansible.builtin.command:
    argv:
      - pidof
      - caddy
  register: hoddmimir_caddy_pid
  changed_when: false

- name: Require exactly one Caddy process
  ansible.builtin.assert:
    that:
      - hoddmimir_caddy_pid.stdout.split() | length == 1
      - hoddmimir_caddy_pid.stdout.split()[0] is match('^[1-9][0-9]*$')
    fail_msg: Exactly one host Caddy process must be running.

- name: Read the Caddy runtime user ID
  ansible.builtin.command:
    argv:
      - id
      - -u
      - caddy
  register: hoddmimir_caddy_uid
  changed_when: false

- name: Read the Caddy process identity from procfs
  ansible.builtin.slurp:
    src: "/proc/{{ hoddmimir_caddy_pid.stdout.split()[0] }}/status"
  register: hoddmimir_caddy_process_status

- name: Require Caddy to run without root privileges
  ansible.builtin.assert:
    that:
      - (hoddmimir_caddy_uid.stdout | trim) is match('^[1-9][0-9]*$')
      - >-
        (hoddmimir_caddy_process_status.content | b64decode)
        is search('(?m)^Uid:\\s+' ~ (hoddmimir_caddy_uid.stdout | trim) ~ '\\s+')
    fail_msg: Host Caddy must run as the dedicated caddy user, never root.

- name: Inspect OpenRC default-runlevel service links
  ansible.builtin.stat:
    path: "/etc/runlevels/default/{{ item }}"
    follow: false
  loop:
    - "{{ hoddmimir_caddy_service }}"
    - crond
  register: hoddmimir_openrc_service_links

- name: Require Caddy and crond to remain enabled in OpenRC
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.islnk
      - item.stat.lnk_source == '/etc/init.d/' ~ item.item
    fail_msg: Caddy and crond must both be enabled in the OpenRC default runlevel.
  loop: "{{ hoddmimir_openrc_service_links.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Read host TCP listeners
  ansible.builtin.command:
    argv:
      - ss
      - -H
      - -lntp
  register: hoddmimir_tcp_listeners
  changed_when: false

- name: Require public TLS listeners and loopback-only application and admin listeners
  ansible.builtin.assert:
    that:
      - >-
        hoddmimir_tcp_listeners.stdout_lines
        | select('search', '(^|\\s)(\\[::\\]|0\\.0\\.0\\.0|\\*):80(\\s|$)')
        | select('search', 'caddy') | list | length >= 1
      - >-
        hoddmimir_tcp_listeners.stdout_lines
        | select('search', '(^|\\s)(\\[::\\]|0\\.0\\.0\\.0|\\*):443(\\s|$)')
        | select('search', 'caddy') | list | length >= 1
      - >-
        hoddmimir_tcp_listeners.stdout_lines
        | select('search', ':' ~ (hoddmimir_web_port | string) ~ '(\\s|$)')
        | list | length == 1
      - >-
        hoddmimir_tcp_listeners.stdout_lines
        | select('search', '127\\.0\\.0\\.1:' ~ (hoddmimir_web_port | string) ~ '(\\s|$)')
        | list | length == 1
      - hoddmimir_tcp_listeners.stdout_lines | select('search', ':2019(\\s|$)') | list | length == 1
      - hoddmimir_tcp_listeners.stdout_lines | select('search', '127\\.0\\.0\\.1:2019(\\s|$)') | select('search', 'caddy') | list | length == 1
    fail_msg: >-
      Expected Caddy on public 80/443, WebApp only on
      127.0.0.1:{{ hoddmimir_web_port }}, and Caddy admin only on 127.0.0.1:2019.

- name: Require a non-expiring public certificate
  ansible.builtin.command:
    argv:
      - "{{ hoddmimir_openssl_executable }}"
      - x509
      - -in
      - "{{ hoddmimir_certificate_file }}"
      - -noout
      - -checkend
      - "86400"
  changed_when: false

- name: Check public HTTPS API health with full certificate verification
  ansible.builtin.uri:
    url: "{{ hoddmimir_https_healthcheck_url }}"
    method: GET
    status_code: 200
    return_content: false
    validate_certs: true
