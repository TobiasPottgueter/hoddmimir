---
- name: Create HTTPS executable and lock parent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hoddmimir_https_runtime_directory_owner }}"
    group: "{{ hoddmimir_https_runtime_directory_group }}"
    mode: "0755"
  loop:
    - "{{ hoddmimir_https_transaction_executable | dirname }}"
    - "{{ hoddmimir_certificate_renewal_executable | dirname }}"
    - "{{ hoddmimir_https_transaction_lock_file | dirname }}"
