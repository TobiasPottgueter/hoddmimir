---
hoddmimir_project_name: hoddmimir
hoddmimir_install_directory: /opt/hoddmimir
hoddmimir_secrets_directory: /etc/hoddmimir/secrets
hoddmimir_compose_file: "{{ hoddmimir_install_directory }}/compose.yaml"
hoddmimir_migration_compose_file: "{{ hoddmimir_install_directory }}/compose.migration.yaml"
hoddmimir_environment_file: "{{ hoddmimir_install_directory }}/runtime.env"
hoddmimir_mariadb_init_script: "{{ hoddmimir_install_directory }}/10-create-app-users.sh"
hoddmimir_transaction_lock_file: "{{ hoddmimir_install_directory }}/.deployment-transaction.lock"
hoddmimir_staging_prefix: .deployment-staging-
hoddmimir_docker_executable: docker
hoddmimir_python_executable: /usr/bin/python3

hoddmimir_data_worker_image: ""
hoddmimir_backup_worker_image: ""
hoddmimir_webapp_image: ""
hoddmimir_mariadb_image: ""

hoddmimir_database_name: hoddmimir
hoddmimir_collector_grid_width_seconds: 120
hoddmimir_evidence_freshness_seconds: 300
hoddmimir_pve_storage_max_node_fanout: 128
hoddmimir_pbs_max_datastore_fanout: 128
hoddmimir_pbs_content_max_datastores: 128
hoddmimir_pbs_content_max_namespaces_per_datastore: 1024
hoddmimir_pbs_content_max_snapshots_per_namespace: 65536
hoddmimir_pbs_content_max_total_snapshots: 262144
hoddmimir_pbs_content_namespace_body_bytes: 8388608
hoddmimir_pbs_content_snapshot_body_bytes: 67108864
hoddmimir_monitor_history_overlap_seconds: 300
hoddmimir_pve_monitor_page_size: 100
hoddmimir_pve_monitor_max_nodes: 128
hoddmimir_pve_monitor_active_page_cap: 2
hoddmimir_pve_monitor_archive_page_cap: 10
hoddmimir_pve_monitor_request_limit: 512
hoddmimir_pve_monitor_raw_row_limit: 25000
hoddmimir_pve_monitor_distinct_task_limit: 25000
hoddmimir_pve_monitor_history_window_seconds: 86400
hoddmimir_pbs_monitor_page_size: 256
hoddmimir_pbs_monitor_max_pages_per_stream: 16
hoddmimir_pbs_monitor_max_rows_per_stream: 4096
hoddmimir_pbs_monitor_max_jobs_per_kind: 4096
hoddmimir_pbs_monitor_history_window_seconds: 86400
hoddmimir_backup_worker_poll_interval_seconds: 5
hoddmimir_backup_worker_heartbeat_ttl_seconds: 150
hoddmimir_backup_execution_enabled: false
hoddmimir_backup_execution_activation_ack: ""
hoddmimir_backup_execution_required_ack: ENABLE_PRODUCTION_BACKUPS
hoddmimir_matrix_notifications_enabled: false
hoddmimir_matrix_webhook_channel: proxmox-backup
hoddmimir_matrix_webhook_timeout_seconds: 10
hoddmimir_web_port: 8080
hoddmimir_healthcheck_url: "http://127.0.0.1:{{ hoddmimir_web_port }}/api/health"
hoddmimir_compose_wait_timeout_seconds: 180
hoddmimir_expected_services:
  - backup-worker
  - data-worker
  - mariadb
  - webapp
hoddmimir_migration_service: schema-migration
hoddmimir_database_service: mariadb
hoddmimir_database_bootstrap_script: /usr/local/bin/hoddmimir-database-user-bootstrap
