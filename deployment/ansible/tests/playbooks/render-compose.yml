---
- name: Render Hoddmímir Compose contract locally
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../roles/hoddmimir/defaults/main.yml"
  tasks:
    - name: Render MariaDB application users
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/hoddmimir/templates/10-create-app-users.sh.j2"
        dest: "{{ hoddmimir_test_mariadb_init_output }}"
        mode: "0555"

    - name: Render production Compose model
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/hoddmimir/templates/compose.yaml.j2"
        dest: "{{ hoddmimir_test_compose_output }}"
        mode: "0600"

    - name: Render production migration Compose model
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/hoddmimir/templates/compose.migration.yaml.j2"
        dest: "{{ hoddmimir_test_migration_compose_output }}"
        mode: "0600"

    - name: Render production runtime environment
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/hoddmimir/templates/runtime.env.j2"
        dest: "{{ hoddmimir_test_runtime_output }}"
        mode: "0640"

    - name: Render canonical encryption keyring
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/hoddmimir/templates/encryption-keyring.json.j2"
        dest: "{{ hoddmimir_test_encryption_key_output }}"
        mode: "0600"
      no_log: true

    - name: Render host Caddy configuration candidate
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/hoddmimir/templates/Caddyfile.j2"
        dest: "{{ hoddmimir_test_caddy_output }}"
        mode: "0640"

    - name: Render host certificate renewal command
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/hoddmimir/templates/hoddmimir-certificate-renew.sh.j2"
        dest: "{{ hoddmimir_test_renewal_output }}"
        mode: "0550"
