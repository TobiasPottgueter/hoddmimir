---
services:
  schema-migration:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: worker
    command: [doctrine:migrations:migrate, --no-interaction, --allow-no-migration, --no-ansi]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: "0"
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_SECRET_FILE: /run/secrets/app_secret
      DATABASE_HOST: mariadb
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MARIADB_DATABASE:-hoddmimir}
      DATABASE_USER: hoddmimir_migration
      DATABASE_PASSWORD_FILE: /run/secrets/mariadb_migration_password
    secrets:
      - app_secret
      - mariadb_migration_password
    networks:
      - internal
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /app/var:uid=10001,gid=10001,mode=0770
      - /run/hoddmimir-secrets:mode=0700
    init: true
    restart: "no"
    cpus: ${APP_CPU_LIMIT:-1.0}
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    pids_limit: ${APP_PIDS_LIMIT:-128}
